<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <h1>2048</h1>
        <div class="scores-container">
          <div class="score-container">
            Current Score: <span id="score">0</span>
          </div>
          <div class="best-container">Best Score: <span id="best">0</span></div>
        </div>
        <button class="new-game-button">New Game</button>
      </div>
      <div class="game-container">
        <div class="grid-container">
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="tile-container"></div>
      </div>
      <p class="game-explanation">
        <strong>HOW TO PLAY:</strong> Use your <strong>arrow keys</strong> to
        move the tiles. When two tiles with the same number touch, they
        <strong>merge into one!</strong>
      </p>
    </div>
    <script src="game.js"></script>
  </body>
</html>
